# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trueworth-brochure-studio
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: brochures
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data/brochures
      - key: APP_USERNAME
        value: trueworth
      - key: APP_PASSWORD
        generateValue: true   # find it under Environment in the Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false           # paste your key when Render asks
      - key: OPENROUTER_MODEL
        value: anthropic/claude-opus-5.5
